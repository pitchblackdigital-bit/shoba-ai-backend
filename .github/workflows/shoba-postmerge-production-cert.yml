name: SHOBA Post-Merge Production Certification

on:
  push:
    branches: [qa/shoba-postmerge-production-cert-20261002]

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Certify production discovery
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://shoba-ai-backend.vercel.app/api/discover-public"
          request () {
            curl --fail-with-body --silent --show-error -X POST "$endpoint"               -H 'Origin: https://shobaconnect.com'               -H 'Content-Type: application/json'               --data "$1"
          }
          search="$(request '{"query":"Bar Business","per_page":8}')"
          refinement="$(request '{"query":"what about Toronto","context":{"previous_query":"Restaurants in Scarborough"},"per_page":8}')"
          zero="$(request '{"query":"qzxvplmn847293","per_page":8}')"
          SEARCH="$search" REFINEMENT="$refinement" ZERO="$zero" node - <<'NODE'
          const search=JSON.parse(process.env.SEARCH);
          const refinement=JSON.parse(process.env.REFINEMENT);
          const zero=JSON.parse(process.env.ZERO);
          for (const [name,r] of Object.entries({search,refinement,zero})) {
            if(r.ok!==true || r.grounded!==true) throw new Error(name+": not grounded");
            if(r.source!=="wordpress_published_directory") throw new Error(name+": wrong source");
            if(!Array.isArray(r.results)) throw new Error(name+": missing results array");
          }
          if(/scarborough/i.test(refinement.resolved_query||"")) throw new Error("refinement: previous location was not replaced");
          if(search.total<1 || !search.results.some(x => /bar business/i.test(x.name||""))) throw new Error("search: known published listing was not returned");
          console.log("LIVE_ZERO_RESULT", JSON.stringify({total:zero.total, names:zero.results.map(x=>x.name), resolved_query:zero.resolved_query}));
          if(zero.total!==0 || zero.results.length!==0) throw new Error("zero: expected no results");
          if(!/couldn't find a published SHOBA listing/i.test(zero.assistant?.message||"")) throw new Error("zero: missing honest no-result message");
          console.log(JSON.stringify({
            search:{total:search.total,resolved_query:search.resolved_query},
            refinement:{total:refinement.total,resolved_query:refinement.resolved_query},
            zero:{total:zero.total,message:zero.assistant.message}
          },null,2));
          NODE
