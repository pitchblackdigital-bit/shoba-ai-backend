name: SHOBA Production Endpoint Probe PR

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production discovery, contextual refinement and zero-result honesty
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://shoba-ai-backend.vercel.app/api/discover-public"
          probe () {
            local name="$1"
            local body="$2"
            curl --fail-with-body --silent --show-error -X POST "$endpoint"               -H 'Origin: https://shobaconnect.com'               -H 'Content-Type: application/json'               --data "$body" > "$name.json"
          }
          probe search '{"query":"Restaurants in Scarborough","per_page":8}'
          probe refinement '{"query":"what about Toronto","context":{"previous_query":"Restaurants in Scarborough"},"per_page":8}'
          probe zero '{"query":"zzzz-no-such-shoba-business-9f8e7d6c","per_page":8}'
          node - <<'NODE'
          const fs=require("fs");
          const search=JSON.parse(fs.readFileSync("search.json","utf8"));
          const refinement=JSON.parse(fs.readFileSync("refinement.json","utf8"));
          const zero=JSON.parse(fs.readFileSync("zero.json","utf8"));
          for (const [name,r] of Object.entries({search,refinement,zero})) {
            if(r.ok!==true || r.grounded!==true) throw new Error(name+": expected ok=true and grounded=true");
            if(r.source!=="wordpress_published_directory") throw new Error(name+": unexpected source");
            if(!Array.isArray(r.results)) throw new Error(name+": expected results array");
          }
          if(!refinement.resolved_query) throw new Error("refinement: missing resolved_query");
          if(zero.total!==0) throw new Error("zero: sentinel query unexpectedly matched");
          if(!zero.assistant || typeof zero.assistant.message!=="string") throw new Error("zero: missing assistant message");
          console.log(JSON.stringify({
            search:{total:search.total,resolved_query:search.resolved_query},
            refinement:{total:refinement.total,resolved_query:refinement.resolved_query},
            zero:{total:zero.total,message:zero.assistant.message}
          },null,2));
          NODE
