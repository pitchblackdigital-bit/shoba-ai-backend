name: SHOBA Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/shoba-ai-search-v1]

jobs:
  search-data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:certification
